baseURL = "https://joaobonin.com/"
  title = "João Vítor Moutinho Bonin"
  theme = "PaperMod"

  enableRobotsTXT = true
  buildDrafts = false
  buildFuture = false

  [pagination]
    pagerSize = 10

  [minify]
    disableXML = true
    minifyOutput = true

  [params]
    env = "production"
    title = "João Vítor Moutinho Bonin"
    description = "Product security engineer. Red team, AD attacks, cloud pentest. CRTA · OSCP track · 2x CTF Brazil champion."
    keywords = ["red team", "penetration testing", "offensive security", "cybersecurity", "CRTA", "OSCP", "active directory", "CTF"]
    author = "João Vítor Bonin"
    DateFormat = "January 2, 2006"
    defaultTheme = "dark"
    disableThemeToggle = false
    copyright = "© 2026 [$ whoami](https://joaobonin.com/) · Built with [Hugo](https://gohugo.io/) + [PaperMod](https://github.com/adityatelange/hugo-PaperMod/)"

    ShowReadingTime = true
    ShowShareButtons = false
    ShowPostNavLinks = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
    ShowToc = true

  [params.cover]
    hiddenInList = false

  [params.label]
    text = "$ cd ~"

  [params.homeInfoParams]
    Title = "João Vítor Bonin"
    Content = """
Product Security Engineer at SAP Office of the CSO. 8 years at SAP across support, enterprise architecture, and security
   governance.
Currently focused on product security assessments and vulnerability management, while building offensive security skills toward OSCP.\n\nPost-grad Red Team Operations (FIAP 2025), CRTA (CyberWarfare Labs
  2026), OSCP in progress (OffSec), eJPTv2 (INE 2023). 2x National Champion at SAP CTF Brazil (2018, 2024).\n\nWriting about red team
   operations, Active Directory attacks, cloud pentest, and C2 infrastructure.

  """

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Snozye"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/joão-bonin"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:bonin.jv@gmail.com"

  [[menu.main]]
    identifier = "posts"
    name = "Write-ups"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 30

  [markup.highlight]
    style = "github-dark"
    lineNos = true
    codeFences = true
    guessSyntax = true
